# Render Blueprint for the Lab 3 books API.
services:
  - type: web
    name: lab-03-books-api
    runtime: node
    rootDir: backend-main/lab-03
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_PATH
        value: ./books.db
